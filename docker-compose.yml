services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: job-posting-db
    # Parallel HNSW index builds allocate dynamic shared memory in /dev/shm,
    # which Docker caps at 64 MB by default.
    shm_size: 4gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobpostings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Embeddings (multilingual-e5-base) and reranking (Qwen3-Reranker-0.6B, chosen
  # on the development set) on the GPU. Requires the NVIDIA Container Toolkit.
  embedding-server:
    build: ./embedding-server
    container_name: job-posting-embeddings
    environment:
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      RERANKER_MODEL: Qwen/Qwen3-Reranker-0.6B
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # bge-reranker-v2-m3, the alternative in the development-set comparison:
  # docker compose --profile rerank-dev up -d reranker-bge
  reranker-bge:
    build: ./embedding-server
    container_name: job-posting-reranker-bge
    profiles: [rerank-dev]
    environment:
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
    ports:
      - "8002:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # e5-base-v2 query embeddings for the embedding-model ablation only:
  # docker compose --profile ablation up -d embedding-server-e5
  embedding-server-e5:
    build: ./embedding-server
    container_name: job-posting-embeddings-e5
    profiles: [ablation]
    environment:
      EMBEDDING_MODEL: intfloat/e5-base-v2
      RERANKER_MODEL: ""
    ports:
      - "8001:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: job-posting-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  huggingface_cache:
  qdrant_data:
